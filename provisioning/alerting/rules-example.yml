apiVersion: 1

# Example rule file. Same shape as Grafana's own file provisioning, so a dev stack can
# bind-mount this directory AND `scripts/grafana-sync.py push` can apply it to a live
# instance over the API.
#
# `datasourceUid: default` is a placeholder resolved to the datasource NAMED by
# $GRAFANA_DEFAULT_DATASOURCE on the target; any other value is read as a datasource
# name; `__expr__` is Grafana's expression engine.

groups:
  - orgId: 1
    name: Disk Alerts
    folder: System Alerts
    interval: 1m
    rules:
      - uid: disk-nearly-full
        title: Disk Nearly Full
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: default
            model:
              expr: 100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes)
              instant: true
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
        noDataState: OK
        execErrState: Error
        for: 10m
        keep_firing_for: 10m
        labels:
          severity: critical
          service: proxmox
        annotations:
          summary: '{{ $labels.instance }} {{ $labels.mountpoint }} is over 90% full'
